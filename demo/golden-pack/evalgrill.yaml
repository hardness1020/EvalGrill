# EvalPack manifest — Demo Corpus golden pack (hand-authored; ADR-0002).
schema_version: 1

name: nr7-research-demo
domain: research
description: >
  Golden EvalPack for the Demo Corpus: evaluates Lantern, a source-grounded
  research assistant, on the fictional question of whether the supplement NR-7
  improves sleep quality. Hand-authored with planted failure conditions so all
  seven PRD §30 detections fire deterministically.

status: HUMAN_REVIEWED # calibration not yet executed; becomes CALIBRATED when the runner lands
remaining_requirements:
  - run judge calibration (scripted replay + live claude -p dogfood)
  - generate coverage-matrix.yaml with the coverage script

artifacts:
  failures: failure-taxonomy.yaml
  dimensions: evaluation-dimensions.yaml
  dataset: dataset.jsonl
  rubric: rubric.yaml
  calibration: calibration.jsonl
  coverage: coverage-matrix.yaml # generated — intentionally not committed here
  protocol: judge-protocol.yaml

validation:
  minimum_failure_coverage: 1
  require_human_verified_tasks: true
  require_veto_calibration: true

# Execution detail, not protocol: which Judge Runner runs calibration locally.
# CLI --runner overrides. Contract pinned by map ticket "Judge Runner interface".
runner:
  default: claude-cli # `claude -p` per ADR-0001 (subscription-first)
  model: claude-haiku-4-5-20251001 # full snapshot id; envelope records what actually ran
  timeout_s: 120 # caller-enforced; no CLI flag exists
  replay_fixture: fixtures/scripted-verdicts.jsonl # Scripted Judge per ADR-0002
